[package]
name = "fluidlab-3d"
version = "0.5.0"
description = "Simulador de circuitos neumáticos, electroneumáticos e hidráulicos con vista 3D"
authors = ["Mpinedo04"]
edition = "2021"

[lib]
name = "fluidlab_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
